<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f3f3" />
    <title>無題 - Web メモ帳</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="window" role="application" aria-label="Web メモ帳">
      <header class="title-bar">
        <div class="app-icon" aria-hidden="true"></div>
        <section class="tab-strip" aria-label="ドキュメントタブ" id="tabStrip">
          <div class="tab-list" id="tabList"></div>
          <button class="tab-new-btn" id="newTabBtn" type="button" aria-label="新しいタブ" title="新しいタブ (Ctrl+T)">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </section>
        <div class="title-bar__drag"></div>
        <h1 id="windowTitle" class="sr-only">無題 - Web メモ帳</h1>
        <div class="title-bar__controls" aria-hidden="true">
          <button class="sys-btn" tabindex="-1" title="最小化">
            <svg viewBox="0 0 12 12" width="10" height="10"><path d="M2 6h8" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="sys-btn" tabindex="-1" title="最大化">
            <svg viewBox="0 0 12 12" width="10" height="10"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="sys-btn sys-btn--close" tabindex="-1" title="閉じる">
            <svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
      </header>

      <nav class="menu-bar" aria-label="メニュー" id="menuBar">
        <div class="menu-bar__menus">
          <button class="menu-item" data-menu="file" id="menuFileBtn">ファイル</button>
          <button class="menu-item" data-menu="edit" id="menuEditBtn">編集</button>
          <button class="menu-item" data-menu="view" id="menuViewBtn">表示</button>
        </div>

        <div class="toolbar" aria-label="書式ツール">
          <button class="tool-btn tool-btn--combo" data-tool="heading" title="見出し">
            <span class="tool-btn__text">H1</span>
            <svg class="chev" viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn tool-btn--combo" data-tool="bullet" title="箇条書き">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="3" cy="4" r="1.2" fill="currentColor"/><circle cx="3" cy="8" r="1.2" fill="currentColor"/><circle cx="3" cy="12" r="1.2" fill="currentColor"/><path d="M6.5 4h7M6.5 8h7M6.5 12h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            <svg class="chev" viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button class="tool-btn tool-btn__b" data-tool="bold" title="太字 (Ctrl+B)">B</button>
          <button class="tool-btn tool-btn__i" data-tool="italic" title="斜体 (Ctrl+I)">I</button>
          <button class="tool-btn tool-btn__s" data-tool="strike" title="取り消し線">S</button>
          <button class="tool-btn" data-tool="link" title="リンク">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l.8-.8a2.4 2.4 0 0 1 3.4 3.4l-1.3 1.3M9 11.5l-.8.8a2.4 2.4 0 0 1-3.4-3.4l1.3-1.3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          </button>
          <button class="tool-btn tool-btn--combo" data-tool="table" title="表">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M2.5 6.3h11M2.5 9.6h11M6 3v10M10 3v10" stroke="currentColor" stroke-width="1.1"/></svg>
            <svg class="chev" viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn" data-tool="clear" title="書式のクリア">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3h7M8 3l-2 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M3 13h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M10.5 9.5l3.5 3.5M14 9.5l-3.5 3.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="toolbar toolbar--right">
          <button class="tool-btn tool-btn--combo" data-tool="ai" title="AI で書き換え">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2l1.1 3.2L12.3 6 9.1 7.1 8 10.3 6.9 7.1 3.7 6l3.2-.8z" fill="currentColor"/><path d="M12.5 10.5l.5 1.4 1.5.5-1.5.5-.5 1.4-.5-1.4-1.5-.5 1.5-.5z" fill="currentColor"/></svg>
            <svg class="chev" viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M3 4.5L6 7.5l3-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn tool-btn--badge" data-tool="feedback" title="フィードバック">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 6.5L11 3v8l-8-3.5V6.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M11 4.5c1.5 0 1.5 5 0 5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 8v3.5h1.8L6 8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn" data-tool="translate" title="表示形式">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 3.5h5M5 3.5v1.5c0 2-1 3.5-2.5 4.5M3.5 6.5c.5 1.5 1.8 2.6 3 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><path d="M8.5 13l2.3-6 2.3 6M9.5 11h3.6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn menu-item" data-menu="help" id="menuHelpBtn" title="設定">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7L3.6 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </nav>

      <section class="dropzone-wrap">
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          wrap="off"
          aria-label="テキスト編集エリア"
        ></textarea>
        <input id="localFileInput" type="file" class="hidden" />
      </section>

      <footer class="status-bar" id="statusBar">
        <div class="status-bar__group">
          <span class="status-item" id="lineCol">行 1、列 1</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="charCount">0 文字</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="textFormat">テキスト</span>
        </div>
        <div class="status-bar__spacer"></div>
        <div class="status-bar__group">
          <span class="status-item" id="zoomLevel">100%</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="lineEnding">Windows (CRLF)</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="statusText">UTF-8</span>
        </div>
      </footer>
    </div>

    <div id="menuPopup" class="menu-popup hidden" role="menu" aria-label="ポップアップメニュー"></div>
    <div id="tabContextPopup" class="menu-popup hidden" role="menu" aria-label="タブメニュー"></div>

    <dialog id="findDialog" class="app-dialog">
      <form method="dialog" id="findForm">
        <h2 id="findDialogTitle">検索</h2>
        <label>
          <span id="findDialogLabel">検索する文字列:</span>
          <input id="findInput" type="text" />
        </label>
        <div class="dialog-actions">
          <button id="findNextBtn" value="default">次を検索</button>
          <button id="findCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="replaceDialog" class="app-dialog">
      <form method="dialog" id="replaceForm">
        <h2 id="replaceDialogTitle">置換</h2>
        <label>
          <span id="replaceFindLabel">検索する文字列:</span>
          <input id="replaceFindInput" type="text" />
        </label>
        <label>
          <span id="replaceToLabel">置換後の文字列:</span>
          <input id="replaceToInput" type="text" />
        </label>
        <div class="dialog-actions">
          <button id="replaceNextBtn" value="default">次を検索</button>
          <button id="replaceOneBtn" value="default">置換</button>
          <button id="replaceAllBtn" value="default">すべて置換</button>
          <button id="replaceCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="goToDialog" class="app-dialog">
      <form method="dialog" id="goToForm">
        <h2 id="goToDialogTitle">指定行へ移動</h2>
        <label>
          <span id="goToDialogLabel">行番号:</span>
          <input id="goToLineInput" type="number" min="1" step="1" />
        </label>
        <div class="dialog-actions">
          <button id="goToBtn" value="default">移動</button>
          <button id="goToCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="unsavedDialog" class="app-dialog">
      <form method="dialog" id="unsavedForm">
        <h2 id="unsavedDialogTitle">未保存の変更</h2>
        <p id="unsavedDialogMessage">このタブには未保存の変更があります。</p>
        <div class="dialog-actions">
          <button id="unsavedSaveBtn" value="save">保存</button>
          <button id="unsavedDiscardBtn" value="discard">保存しない</button>
          <button id="unsavedCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="aboutDialog" class="app-dialog">
      <form method="dialog">
        <h2 id="aboutDialogTitle">バージョン情報</h2>
        <p id="aboutName">Web メモ帳</p>
        <p id="aboutDesc">Windows メモ帳風 UI のブラウザ版テキストエディタです。</p>
        <div class="dialog-actions">
          <button id="aboutOkBtn" value="default">OK</button>
        </div>
      </form>
    </dialog>

    <dialog id="driveConfigDialog" class="app-dialog">
      <form method="dialog" id="driveConfigForm">
        <h2 id="driveConfigTitle">Google Drive 設定</h2>
        <p class="hint" id="driveConfigHint">Google Cloud で発行した OAuth クライアントIDを入力してください。</p>
        <label>
          <span id="driveClientLabel">OAuth Client ID:</span>
          <input id="driveClientIdInput" type="text" placeholder="1234567890-xxxxx.apps.googleusercontent.com" />
        </label>
        <div class="dialog-actions">
          <button id="saveDriveConfigBtn" value="default">保存</button>
          <button id="driveConfigCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="driveFileDialog" class="app-dialog drive-file-dialog">
      <form method="dialog" id="driveFileForm">
        <h2 id="driveFileDialogTitle">Google Drive から開く</h2>
        <div id="driveFileList" class="drive-file-list"></div>
        <div class="dialog-actions">
          <button id="driveFileCloseBtn" value="cancel">閉じる</button>
        </div>
      </form>
    </dialog>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
