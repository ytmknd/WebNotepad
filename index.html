<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f3f3" />
    <title>無題 - Web メモ帳</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="window" role="application" aria-label="Web メモ帳">
      <header class="title-bar">
        <div class="app-icon" aria-hidden="true"></div>
        <section class="tab-strip" aria-label="ドキュメントタブ" id="tabStrip">
          <div class="tab-list" id="tabList"></div>
          <button class="tab-new-btn" id="newTabBtn" type="button" aria-label="新しいタブ" title="新しいタブ (Ctrl+T)">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </section>
        <div class="title-bar__drag"></div>
        <h1 id="windowTitle" class="sr-only">無題 - Web メモ帳</h1>
        <div class="title-bar__controls" aria-hidden="true">
          <button class="sys-btn" tabindex="-1" title="最小化">
            <svg viewBox="0 0 12 12" width="10" height="10"><path d="M2 6h8" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="sys-btn" tabindex="-1" title="最大化">
            <svg viewBox="0 0 12 12" width="10" height="10"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button class="sys-btn sys-btn--close" tabindex="-1" title="閉じる">
            <svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
      </header>

      <nav class="menu-bar" aria-label="メニュー" id="menuBar">
        <div class="menu-bar__menus">
          <button class="menu-item" data-menu="file" id="menuFileBtn">ファイル</button>
          <button class="menu-item" data-menu="edit" id="menuEditBtn">編集</button>
          <button class="menu-item" data-menu="view" id="menuViewBtn">表示</button>
          <button class="menu-item" data-menu="help" id="menuHelpBtn">ヘルプ</button>
        </div>
        <div class="menu-bar__spacer"></div>
        <button class="tool-btn" id="settingsBtn" type="button" title="設定" aria-label="設定">
          <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><circle cx="8" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.7v1.7M8 12.6v1.7M14.3 8h-1.7M3.4 8H1.7M12.45 3.55l-1.2 1.2M4.75 11.25l-1.2 1.2M12.45 12.45l-1.2-1.2M4.75 4.75l-1.2-1.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
      </nav>

      <section class="dropzone-wrap">
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          wrap="off"
          aria-label="テキスト編集エリア"
        ></textarea>
        <input id="localFileInput" type="file" class="hidden" />
      </section>

      <footer class="status-bar" id="statusBar">
        <div class="status-bar__group">
          <span class="status-item" id="lineCol">行 1、列 1</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="charCount">0 文字</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="textFormat">テキスト</span>
        </div>
        <div class="status-bar__spacer"></div>
        <div class="status-bar__group">
          <span class="status-item" id="zoomLevel">100%</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="lineEnding">Windows (CRLF)</span>
          <span class="status-sep" aria-hidden="true"></span>
          <span class="status-item" id="statusText">UTF-8</span>
        </div>
      </footer>
    </div>

    <div id="menuPopup" class="menu-popup hidden" role="menu" aria-label="ポップアップメニュー"></div>
    <div id="tabContextPopup" class="menu-popup hidden" role="menu" aria-label="タブメニュー"></div>

    <dialog id="settingsDialog" class="app-dialog settings-dialog">
      <form method="dialog" id="settingsForm">
        <h2 id="settingsTitle">設定</h2>

        <section class="settings-group">
          <h3 id="settingsFontHeading" class="settings-group__title">フォント</h3>
          <label>
            <span id="settingsFontFamilyLabel">フォント ファミリー</span>
            <select id="settingsFontFamily">
              <option value='"Cascadia Mono", Consolas, "Lucida Console", monospace'>Cascadia Mono / Consolas</option>
              <option value='Consolas, monospace'>Consolas</option>
              <option value='"Yu Gothic UI", "Yu Gothic", sans-serif'>游ゴシック UI</option>
              <option value='Meiryo, sans-serif'>メイリオ</option>
              <option value='"MS Gothic", "ＭＳ ゴシック", monospace'>ＭＳ ゴシック</option>
              <option value='"Segoe UI Variable Text", "Segoe UI", sans-serif'>Segoe UI</option>
              <option value='"Courier New", monospace'>Courier New</option>
            </select>
          </label>
          <label>
            <span id="settingsFontSizeLabel">サイズ</span>
            <select id="settingsFontSize">
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="18">18</option>
              <option value="20">20</option>
              <option value="24">24</option>
              <option value="28">28</option>
              <option value="36">36</option>
              <option value="48">48</option>
              <option value="72">72</option>
            </select>
          </label>
        </section>

        <section class="settings-group">
          <label class="settings-toggle">
            <input type="checkbox" id="settingsWordWrap" />
            <span id="settingsWordWrapLabel">文字列の折り返し</span>
          </label>
          <label class="settings-toggle">
            <input type="checkbox" id="settingsStatusBar" />
            <span id="settingsStatusBarLabel">ステータス バー</span>
          </label>
        </section>

        <div class="dialog-actions">
          <button id="settingsCloseBtn" value="default">閉じる</button>
        </div>
      </form>
    </dialog>

    <dialog id="findDialog" class="app-dialog">
      <form method="dialog" id="findForm">
        <h2 id="findDialogTitle">検索</h2>
        <label>
          <span id="findDialogLabel">検索する文字列:</span>
          <input id="findInput" type="text" />
        </label>
        <div class="dialog-actions">
          <button id="findNextBtn" value="default">次を検索</button>
          <button id="findCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="replaceDialog" class="app-dialog">
      <form method="dialog" id="replaceForm">
        <h2 id="replaceDialogTitle">置換</h2>
        <label>
          <span id="replaceFindLabel">検索する文字列:</span>
          <input id="replaceFindInput" type="text" />
        </label>
        <label>
          <span id="replaceToLabel">置換後の文字列:</span>
          <input id="replaceToInput" type="text" />
        </label>
        <div class="dialog-actions">
          <button id="replaceNextBtn" value="default">次を検索</button>
          <button id="replaceOneBtn" value="default">置換</button>
          <button id="replaceAllBtn" value="default">すべて置換</button>
          <button id="replaceCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="goToDialog" class="app-dialog">
      <form method="dialog" id="goToForm">
        <h2 id="goToDialogTitle">指定行へ移動</h2>
        <label>
          <span id="goToDialogLabel">行番号:</span>
          <input id="goToLineInput" type="number" min="1" step="1" />
        </label>
        <div class="dialog-actions">
          <button id="goToBtn" value="default">移動</button>
          <button id="goToCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="unsavedDialog" class="app-dialog">
      <form method="dialog" id="unsavedForm">
        <h2 id="unsavedDialogTitle">未保存の変更</h2>
        <p id="unsavedDialogMessage">このタブには未保存の変更があります。</p>
        <div class="dialog-actions">
          <button id="unsavedSaveBtn" value="save">保存</button>
          <button id="unsavedDiscardBtn" value="discard">保存しない</button>
          <button id="unsavedCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="aboutDialog" class="app-dialog">
      <form method="dialog">
        <h2 id="aboutDialogTitle">バージョン情報</h2>
        <p id="aboutName">Web メモ帳</p>
        <p id="aboutDesc">Windows メモ帳風 UI のブラウザ版テキストエディタです。</p>
        <div class="dialog-actions">
          <button id="aboutOkBtn" value="default">OK</button>
        </div>
      </form>
    </dialog>

    <dialog id="driveConfigDialog" class="app-dialog">
      <form method="dialog" id="driveConfigForm">
        <h2 id="driveConfigTitle">Google Drive 設定</h2>
        <p class="hint" id="driveConfigHint">Google Cloud で発行した OAuth クライアントIDを入力してください。</p>
        <label>
          <span id="driveClientLabel">OAuth Client ID:</span>
          <input id="driveClientIdInput" type="text" placeholder="1234567890-xxxxx.apps.googleusercontent.com" />
        </label>
        <div class="dialog-actions">
          <button id="saveDriveConfigBtn" value="default">保存</button>
          <button id="driveConfigCancelBtn" value="cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <dialog id="driveFileDialog" class="app-dialog drive-file-dialog">
      <form method="dialog" id="driveFileForm">
        <h2 id="driveFileDialogTitle">Google Drive から開く</h2>
        <div id="driveFileList" class="drive-file-list"></div>
        <div class="dialog-actions">
          <button id="driveFileCloseBtn" value="cancel">閉じる</button>
        </div>
      </form>
    </dialog>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
